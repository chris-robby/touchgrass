<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Touchgrass — mobile home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5A3A}a:hover{color:#13281E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; color: #13281E; background: #EEF2E6; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #13281E; color: #EEF2E6; padding: 18px 16px 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="26" height="22" viewBox="0 0 26 22" fill="none" stroke="#C8F169" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 21C4 14 2 9 1 6"></path><path d="M9 21C9 13 9 6 11 1"></path><path d="M14 21C14 15 16 10 20 7"></path><path d="M19 21C20 17 22 14 25 13"></path></svg>
      <span style="font-family: 'Young Serif', Georgia, serif; font-size: 26px; color: #C8F169; flex: 1; letter-spacing: -0.01em">touchgrass</span>
      <button type="button" aria-label="Switch language" style="height: 40px; padding: 0 12px; border: 1.5px solid #5E7A6A; border-radius: 8px; background: transparent; font: inherit; font-size: 13px; font-weight: 700; color: #EEF2E6">FR / EN</button>
    </div>
    <h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 30px; line-height: 1.1">Free &amp; almost-free things to do in Montréal.</h1>
    <label style="display: flex; align-items: center; gap: 8px; background: #EEF2E6; border-radius: 8px; padding: 0 12px; height: 46px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4E5F55" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <span style="position: absolute; left: -9999px">Search events</span>
      <input type="search" placeholder="Concerts, parks, workshops…" style="border: 0; outline: none; font: inherit; font-size: 15px; flex: 1; min-width: 0; background: transparent; color: #13281E">
    </label>
  </header>

  <div role="group" aria-label="Filters" style="padding: 12px 16px; display: flex; gap: 8px; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid #C9D3C1">
    <button type="button" aria-pressed="true" style="flex: 0 0 auto; height: 40px; padding: 0 14px; border-radius: 8px; border: 0; background: #1F5A3A; color: #EEF2E6; font: inherit; font-size: 14px; font-weight: 700">This weekend</button>
    <button type="button" aria-pressed="true" style="flex: 0 0 auto; height: 40px; padding: 0 14px; border-radius: 8px; border: 0; background: #1F5A3A; color: #EEF2E6; font: inherit; font-size: 14px; font-weight: 700">Up to $10</button>
    <button type="button" aria-pressed="false" style="flex: 0 0 auto; height: 40px; padding: 0 14px; border-radius: 8px; border: 1.5px solid #13281E; background: transparent; color: #13281E; font: inherit; font-size: 14px">Category</button>
    <button type="button" aria-pressed="false" style="flex: 0 0 auto; height: 40px; padding: 0 14px; border-radius: 8px; border: 1.5px solid #13281E; background: transparent; color: #13281E; font: inherit; font-size: 14px">Borough</button>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 4px 16px 16px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <section>
        <h2 style="margin: 18px 0 2px; display: flex; align-items: baseline; justify-content: space-between; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 24px">{{g.label}} <span style="font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4E5F55">{{g.date}}</span></h2>
        <sc-for list="{{g.events}}" as="e" hint-placeholder-count="2">
          <a href="MobileCalendar.dc.html" style="display: grid; grid-template-columns: 58px 1fr auto; gap: 12px; align-items: start; padding: 14px 0; border-bottom: 1px solid #C9D3C1; text-decoration: none; color: #13281E">
            <span style="font-family: 'Young Serif', Georgia, serif; font-size: 18px; line-height: 1.1">{{e.time}}<span style="display: block; font-family: 'Atkinson Hyperlegible', sans-serif; font-size: 11px; font-weight: 700; color: #4E5F55; margin-top: 2px">{{e.ampm}}</span></span>
            <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
              <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #1F5A3A">{{e.cat}}</span>
              <span style="font-size: 17px; font-weight: 700; line-height: 1.25">{{e.title}}</span>
              <span style="font-size: 13px; color: #4E5F55">{{e.venue}} · {{e.borough}}</span>
            </span>
            <span style="{{e.priceStyle}}; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; padding: 4px 8px; border-radius: 4px; white-space: nowrap">{{e.price}}</span>
          </a>
        </sc-for>
      </section>
    </sc-for>
  </div>

  <nav aria-label="Views" style="background: #13281E; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px 8px 20px">
    <a href="MobileHome.dc.html" aria-current="page" style="height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #C8F169; font-size: 12px; font-weight: 700; border-top: 3px solid #C8F169"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"></path></svg>List</a>
    <a href="MobileCalendar.dc.html" style="height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #B9C8B5; font-size: 12px; border-top: 3px solid transparent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Calendar</a>
    <a href="Main.dc.html#map" style="height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #B9C8B5; font-size: 12px; border-top: 3px solid transparent"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0114 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>Map</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const free = 'background:#C8F169;color:#13281E';
    const paid = 'border:1.5px solid #13281E;color:#13281E';
    const ev = (time, ampm, title, cat, price, venue, borough) => ({
      time, ampm, title, cat, price: price === 'Free' ? 'FREE' : price, venue, borough,
      priceStyle: price === 'Free' ? free : paid
    });
    const groups = [
      { label: 'Today', date: 'Sat · Oct 31', events: [
        ev('5:00', 'PM', "Parade d'Halloween du quartier", 'Family', 'Free', 'Parc Laurier', 'Plateau')
      ]},
      { label: 'Tomorrow', date: 'Sun · Nov 1', events: [
        ev('1:00', 'PM', 'Heure du conte bilingue', 'Family', 'Free', 'Bibliothèque du quartier', 'Rosemont'),
        ev('7:30', 'PM', 'Concert de musique de chambre', 'Music', 'Free', 'Maison de la culture', 'Plateau')
      ]},
      { label: 'Next weekend', date: 'Nov 7 – 8', events: [
        ev('9:30', 'AM', 'Yoga au parc', 'Outdoors', 'Free', 'Parc La Fontaine', 'Plateau'),
        ev('2:00', 'PM', 'Atelier de céramique pour ados', 'Workshop', '$5', 'Centre culturel', 'Verdun'),
        ev('11:00', 'AM', "Marché d'artisans", 'Exhibit', 'Free', 'Salle communautaire', 'Rosemont')
      ]}
    ];
    return { groups };
  }
}
</script>
</body>
</html>
